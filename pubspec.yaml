name: calc_for_all
description: Calc For All - Calculatrice scientifique avancee avec graphiques, nombres complexes et etude de fonction.
publish_to: 'none'
version: 3.4.0+13

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  math_expressions: ^2.6.0
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.0
  pdf: ^3.11.1
  printing: ^5.13.3
  path_provider: ^2.1.4
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
