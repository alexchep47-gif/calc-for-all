name: Build APK + Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter pub get

      - name: Build APK arm64
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: calc-for-all-apk-arm64
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter pub get

      - name: Prepare web
        run: |
          flutter config --enable-web
          flutter create --project-name calc_for_all --platforms=web . || true

      - name: Build Flutter Web for /app/
        run: |
          echo "Building version from pubspec:"
          grep '^version:' pubspec.yaml
          flutter build web --release --base-href "/app/"
          # Cache-bust: inject build id into index for hard refresh
          BUILD_ID="${{ github.sha }}"
          echo "$BUILD_ID" > build/web/.last_build_id
          if [ -f build/web/index.html ]; then
            sed -i "s|flutter_bootstrap.js|flutter_bootstrap.js?v=${BUILD_ID}|g" build/web/index.html || true
            sed -i "s|flutter.js|flutter.js?v=${BUILD_ID}|g" build/web/index.html || true
          fi
          echo "Built version.json:"
          cat build/web/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: calc-for-all-web
          path: build/web

      - name: Deploy to calc-for-all-web /app (Vercel)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT absent — skip deploy Vercel (artifact web disponible)"
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/cfa-web
          git clone --depth 1 "https://x-access-token:${GH_PAT}@github.com/alexchep47-gif/calc-for-all-web.git" /tmp/cfa-web
          rm -rf /tmp/cfa-web/app
          mkdir -p /tmp/cfa-web/app
          cp -a build/web/. /tmp/cfa-web/app/
          echo "${{ github.sha }}" > /tmp/cfa-web/app/.last_build_id
          echo "${{ github.sha }}" > /tmp/cfa-web/.calc-for-all-source-sha
          # Force change so Vercel always redeploys
          date -u +"%Y-%m-%dT%H:%M:%SZ" > /tmp/cfa-web/app/.deployed_at
          cd /tmp/cfa-web
          git add -A
          git status
          git commit -m "Deploy Calc For All 3.1.0 ${{ github.sha }}" || echo "Nothing to commit"
          git push origin main
          echo "Deployed 3.1.0 to calc-for-all-web/app — Vercel will pick up"
