name: Build APK + Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter pub get

      - name: Build APK arm64
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: calc-for-all-apk-arm64
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter pub get

      - name: Prepare web platform
        run: |
          flutter config --enable-web
          flutter create --project-name calc_for_all --platforms=web .

      - name: Build Flutter Web for /app/
        run: flutter build web --release --base-href "/app/"

      - uses: actions/upload-artifact@v4
        with:
          name: calc-for-all-web
          path: build/web

      # Deploie dans le depot calc-for-all-web sous /app
      - name: Deploy to calc-for-all-web /app
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.GITHUB_TOKEN }}
        with:
          source-directory: build/web
          destination-github-username: alexchep47-gif
          destination-repository-name: calc-for-all-web
          user-email: github-actions[bot]@users.noreply.github.com
          target-branch: main
          target-directory: app
        continue-on-error: true
