name: Build APK + Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter pub get

      - name: Build APK arm64
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: calc-for-all-apk-arm64
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter pub get

      - name: Prepare web
        run: |
          flutter config --enable-web
          flutter create --project-name calc_for_all --platforms=web . || true

      - name: Build Flutter Web for /app/
        run: |
          flutter build web --release --base-href "/app/"
          cat build/web/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: calc-for-all-web
          path: build/web

      # Deploie dans calc-for-all-web/app si le secret GH_PAT existe
      # (token perso avec droit repo sur alexchep47-gif/calc-for-all-web)
      - name: Deploy to calc-for-all-web /app
        if: ${{ secrets.GH_PAT != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAT }}
          external_repository: alexchep47-gif/calc-for-all-web
          publish_dir: ./build/web
          destination_dir: app
          publish_branch: main
          keep_files: false
          allow_empty_commit: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Deploy Flutter Web ${{ github.sha }}
